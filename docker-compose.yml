name: rag-practice-2
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local_demo
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rag -d rag']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - '${OLLAMA_STORAGE:-ollama_models}:/root/.ollama/models'
    healthcheck:
      test: [CMD, ollama, list]
      interval: 3s
      timeout: 3s
      retries: 30
  rag:
    build: .
    command: [sleep, infinity]
    environment:
      DATABASE_URL: postgresql://rag:rag_local_demo@db:5432/rag
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./corpus:/app/corpus:ro
volumes:
  db_data:
  ollama_models:
